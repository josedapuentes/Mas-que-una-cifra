<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña | Más que una cifra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);">

  <div class="modal-card" style="max-width: 420px; text-align: center; padding: 3rem 2.5rem;">
    <img src="img/logo-mquc.png" alt="Logo" style="width: 120px; height: 120px; margin-bottom: 2rem;">
    <h1>Nueva Contraseña</h1>
    <p style="margin-bottom: 2rem; color: var(--text-secondary);">Ingresa una nueva contraseña para tu cuenta.</p>
    
    <form id="resetForm" style="text-align: left;">
      <div class="form-group">
        <label class="form-label">Nueva Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">
        Actualizar Contraseña
      </button>
      <div id="msg" style="margin-top: 1rem; text-align: center; font-size: 0.85rem; display: none;"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const conf = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      if (pwd !== conf) {
        msg.style.display = 'block';
        msg.style.color = 'var(--accent-rose)';
        msg.innerText = 'Las contraseñas no coinciden.';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Actualizando...';

      try {
        const sb = getSupabaseClient();
        const { error } = await sb.auth.updateUser({ password: pwd });

        if (error) throw error;

        msg.style.display = 'block';
        msg.style.color = '#39B7B3';
        msg.innerText = '¡Contraseña actualizada con éxito! Redirigiendo al login...';
        setTimeout(() => { window.location.href = 'login.html'; }, 3000);
      } catch (err) {
        msg.style.display = 'block';
        msg.style.color = 'var(--accent-rose)';
        msg.innerText = 'Error: ' + err.message;
        btn.disabled = false;
        btn.innerText = 'Actualizar Contraseña';
      }
    };
  </script>
</body>
</html>
