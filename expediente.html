<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expediente de Memoria | Más que una cifra</title>
  <link rel="stylesheet" href="styles.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .expediente-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 3rem;
      max-width: 900px;
      margin: 2rem auto;
      box-shadow: var(--shadow-card);
    }
    .badge-seal {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .timeline-box {
      border-left: 2px solid var(--accent-gold);
      padding-left: 1.5rem;
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
      <header class="navbar">
    <a href="index.html" class="logo-container" style="display: flex; align-items: center; gap: 1.5rem;">
      <img src="img/logo-ubpd.png" alt="Logo UBPD" style="width: 81px; height: 81px; object-fit: contain;">
      <img src="img/logo-mquc.png" alt="Logo Más que una cifra" style="width: 81px; height: 81px; object-fit: contain;">
    </a>

    <div style="display: flex; align-items: center; gap: 2rem;">
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li class="nav-separator">|</li>
          <li><a href="historias.html" class="nav-link">Las historias</a></li>
          <li class="nav-separator">|</li>
          <li><a href="https://unidadbusqueda.gov.co/acerca-ubpd/" class="nav-link" target="_blank">Sobre la UBPD</a></li>
        </ul>
      </nav>

      <!-- Autenticación -->
      <div id="authContainer">
        <a href="login.html" class="btn-nav-upload">Carga historias</a>
      </div>
    </div>
  </header>

  <main class="container" id="mainContainer">
    <!-- Contenido cargado dinámicamente vía Javascript -->
  </main>

  <footer>
    <p><strong>Más que una cifra</strong> &copy; 2026 — Unidad de Búsqueda de Personas dadas por Desaparecidas (UBPD)</p>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const container = document.getElementById("mainContainer");
      
      if (!code) {
        container.innerHTML = `<div style="text-align:center; padding: 5rem;"><a href="index.html" class="btn btn-primary">Volver al Inicio</a></div>`;
        return;
      }

      const story = await DB.getStoryByCode(code);

      if (!story) {
        container.innerHTML = `
          <div style="text-align: center; padding: 5rem 1rem;">
            <h2>Expediente no encontrado</h2>
            <p style="color: var(--text-secondary); margin: 1rem 0;">El código ${code} no corresponde a un registro activo.</p>
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="max-width: 900px; margin: 0 auto; padding-top: 2rem;">
          <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
            ${story.foto_url 
              ? \`<img src="\${story.foto_url}" alt="Fotografía de \${story.nombre_persona}" style="width: 300px; height: 380px; object-fit: cover; flex-shrink: 0; background: #D1D1D1;">\`
              : \`<div style="background: #D1D1D1; width: 300px; height: 380px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 1.2rem; flex-shrink: 0;">Fotografía</div>\`
            }
            <div style="display: flex; align-items: center; padding-left: 1rem;">
              <h1 style="font-family: var(--font-sans); font-size: 3rem; color: #fff; font-weight: 700; line-height: 1.2;">${story.nombre_persona}</h1>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 180px 1fr 180px 1fr; gap: 1.5rem; align-items: center; margin-bottom: 1.5rem;">
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center;">Región</div>
            <div style="background: #D1D1D1; padding: 1rem; color: #000; min-height: 55px; display: flex; align-items: center;">${story.region || ''}</div>
            
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center;">Municipio</div>
            <div style="background: #D1D1D1; padding: 1rem; color: #000; min-height: 55px; display: flex; align-items: center;">${story.municipio || ''}</div>
          </div>

          <div style="display: grid; grid-template-columns: 180px 1fr 180px 1fr; gap: 1.5rem; align-items: stretch; margin-bottom: 1.5rem;">
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center;">Edad</div>
            <div style="background: #D1D1D1; padding: 1rem; color: #000; min-height: 55px; display: flex; align-items: center;">${story.edad || '-'}</div>
            
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center; line-height: 1.2; display: flex; align-items: center; justify-content: center;">Fecha de<br>los hechos</div>
            <div style="background: #D1D1D1; padding: 1rem; color: #000; min-height: 55px; display: flex; align-items: center;">${story.fecha_hecho || ''}</div>
          </div>

          <div style="display: grid; grid-template-columns: 180px 1fr; gap: 1.5rem; align-items: stretch; margin-bottom: 1.5rem;">
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center; line-height: 1.2; display: flex; align-items: center; justify-content: center;">Categoría de<br>Vida / Rol</div>
            <div style="background: #D1D1D1; padding: 1rem; color: #000; min-height: 55px; display: flex; align-items: center;">${story.categoria || ''}</div>
          </div>

          <div style="display: grid; grid-template-columns: 180px 1fr; gap: 1.5rem; align-items: stretch; margin-bottom: 4rem;">
            <div style="background: var(--accent-emerald); padding: 1rem; color: #000; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center;">Testimonio</div>
            <div style="background: #D1D1D1; padding: 1.5rem; color: #000; min-height: 250px; white-space: pre-wrap; line-height: 1.6;">${story.relato || ''}</div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <a href="index.html" class="btn btn-primary" style="padding: 1rem 3rem; border-radius: 0; color: #000; font-weight: 800; font-size: 1.1rem;">Ir al inicio</a>
            <a href="historias.html" class="btn btn-primary" style="padding: 1rem 3rem; border-radius: 0; color: #000; font-weight: 800; font-size: 1.1rem;">Ver otras historias</a>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
