<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expediente de Memoria | Más que una cifra</title>
  <link rel="stylesheet" href="styles.css?v=12">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .expediente-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 3rem;
      max-width: 900px;
      margin: 2rem auto;
      box-shadow: var(--shadow-card);
    }
    .badge-seal {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .timeline-box {
      border-left: 2px solid var(--accent-gold);
      padding-left: 1.5rem;
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
      <header class="navbar">
    <a href="index.html" class="logo-container" style="display: flex; align-items: center; gap: 1.5rem;">
      <img src="img/logo-ubpd.png" alt="Logo UBPD" style="width: 81px; height: 81px; object-fit: contain;">
      <img src="img/logo-mquc.png" alt="Logo Más que una cifra" style="width: 81px; height: 81px; object-fit: contain;">
    </a>

    <div style="display: flex; align-items: center; gap: 2rem;">
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li class="nav-separator">|</li>
          <li><a href="mapa.html" class="nav-link">Mapa</a></li>
          <li class="nav-separator">|</li>
          <li><a href="historias.html" class="nav-link">Las historias</a></li>
          <li class="nav-separator">|</li>
          <li><a href="https://unidadbusqueda.gov.co/acerca-ubpd/" class="nav-link" target="_blank">Sobre la UBPD</a></li>
        </ul>
      </nav>

      <!-- Autenticación -->
      <div id="authContainer">
        <a href="login.html" class="btn-nav-upload">Carga historias</a>
      </div>
    </div>
  </header>

  <main class="container" id="mainContainer" style="background: var(--bg-primary); min-height: calc(100vh - 81px); padding: 2rem 4rem;">
    <!-- Contenido cargado dinámicamente vía Javascript -->
  </main>

  <footer>
    <p><strong>Más que una cifra</strong> &copy; 2026 — Unidad de Búsqueda de Personas dadas por Desaparecidas (UBPD)</p>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const container = document.getElementById("mainContainer");
      
      if (!code) {
        container.innerHTML = `<div style="text-align:center; padding: 5rem;"><a href="index.html" class="btn btn-primary">Volver al Inicio</a></div>`;
        return;
      }

      const story = await DB.getStoryByCode(code);

      if (!story) {
        container.innerHTML = `
          <div style="text-align: center; padding: 5rem 1rem;">
            <h2>Expediente no encontrado</h2>
            <p style="color: var(--text-secondary); margin: 1rem 0;">El código ${code} no corresponde a un registro activo.</p>
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
          </div>
        `;
        return;
      }

      const tipoCaso = story.tipo_caso || 'Entrega digna';
      const shareText = `Hola, les quiero contar la historia de ${story.nombre_persona}, persona desaparecida por el conflicto armado en Colombia y que hoy regresó a su familia gracias a un ${tipoCaso}.`;
      const shareUrl = window.location.href;
      
      const twitterShare = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
      const whatsappShare = `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
      const facebookShare = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`;

      container.innerHTML = `
        <div style="max-width: 1000px; margin: 0 auto; padding-top: 2rem; display: flex; gap: 3rem; align-items: flex-start;">
          
          <!-- Columna Izquierda: Foto y Botones -->
          <div style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1rem;">
            <div style="background: #D1D1D1; height: 400px; display: flex; align-items: center; justify-content: center;">
              ${story.foto_url 
                ? `<img src="${story.foto_url}" alt="Fotografía de ${story.nombre_persona}" style="width: 100%; height: 100%; object-fit: cover; display: block;">`
                : `<div style="font-weight: bold; color: #000; font-size: 1.5rem;">Fotografía</div>`
              }
            </div>
            
            <a href="mapa.html" class="btn" style="background-color: #F4A261; color: black; font-weight: 800; padding: 1rem; border-radius: 0; text-decoration: none; text-align: center; font-size: 1.5rem;">Regresar al mapa</a>
            
            <div style="text-align: center; color: black; font-size: 1.1rem; font-weight: 500; margin-top: 0.5rem;">Comparte este perfil en redes sociales</div>
            
            <div style="display: flex; justify-content: center; gap: 1.5rem; margin-top: 0.5rem;">
              <a href="${twitterShare}" target="_blank" title="Compartir en X">
                <img src="img/icon-x.png" alt="X" style="width: 50px; height: 50px; object-fit: contain;">
              </a>
              <a href="${whatsappShare}" target="_blank" title="Compartir en WhatsApp">
                <img src="img/icon-whatsapp.png" alt="WhatsApp" style="width: 50px; height: 50px; object-fit: contain;">
              </a>
              <a href="${facebookShare}" target="_blank" title="Compartir en Facebook">
                <img src="img/icon-facebook.png" alt="Facebook" style="width: 50px; height: 50px; object-fit: contain;">
              </a>
            </div>
          </div>

          <!-- Columna Derecha: Todo lo demás -->
          <div style="flex: 1; display: flex; flex-direction: column;">
            
            <h1 style="font-family: var(--font-sans); font-size: 2.2rem; color: #fff; font-weight: 700; line-height: 1.2; text-align: center; margin-bottom: 2rem;">
              ${story.nombre_persona}
            </h1>
            
            <!-- Badges -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
              <div style="background: var(--accent-emerald); padding: 0.8rem 2rem; color: #000; font-weight: 800; font-size: 1.1rem; flex: 1; margin-right: 1rem; text-align: center;">Esta es su historia</div>
              <div style="background: #F4A261; padding: 0.8rem 2rem; color: #000; font-weight: 800; font-size: 1.1rem; flex: 1.2; text-align: center;">${story.tipo_caso || 'Entrega digna'}</div>
            </div>
            
            <!-- Relato -->
            <div style="background: #D1D1D1; padding: 1.5rem; color: #000; flex: 1; white-space: pre-wrap; line-height: 1.6; min-height: 250px; margin-bottom: 2rem;">${story.relato || ''}</div>
            
            <!-- Detalles en Grid (Región, Municipio, etc.) -->
            <div style="display: grid; grid-template-columns: 140px 1fr 140px 1fr; gap: 1rem; align-items: stretch; margin-bottom: 1.5rem;">
              <div style="background: var(--accent-emerald); padding: 0.8rem; color: #000; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">Región</div>
              <div style="background: #D1D1D1; padding: 0.8rem; color: #000; display: flex; align-items: center; font-size: 1.1rem;">${story.region || ''}</div>
              
              <div style="background: var(--accent-emerald); padding: 0.8rem; color: #000; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">Municipio</div>
              <div style="background: #D1D1D1; padding: 0.8rem; color: #000; display: flex; align-items: center; font-size: 1.1rem;">${story.municipio || ''}</div>
            </div>

            <div style="display: grid; grid-template-columns: 140px 1fr 140px 1fr; gap: 1rem; align-items: stretch; margin-bottom: 1.5rem;">
              <div style="background: var(--accent-emerald); padding: 0.8rem; color: #000; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">Edad</div>
              <div style="background: #D1D1D1; padding: 0.8rem; color: #000; display: flex; align-items: center; font-size: 1.1rem;">${story.edad || '-'}</div>
              
              <div style="background: var(--accent-emerald); padding: 0.8rem; color: #000; font-weight: 800; text-align: center; line-height: 1.2; display: flex; align-items: center; justify-content: center; font-size: 1rem;">Fecha de<br>los hechos</div>
              <div style="background: #D1D1D1; padding: 0.8rem; color: #000; display: flex; align-items: center; font-size: 1.1rem;">${story.fecha_hecho || ''}</div>
            </div>

            <div style="display: grid; grid-template-columns: 140px 1fr; gap: 1.5rem; align-items: stretch; margin-bottom: 3rem;">
              <div style="background: var(--accent-emerald); padding: 0.8rem; color: #000; font-weight: 800; text-align: center; line-height: 1.2; display: flex; align-items: center; justify-content: center; font-size: 1rem;">Categoría de<br>Vida / Rol</div>
              <div style="background: #D1D1D1; padding: 0.8rem; color: #000; display: flex; align-items: center; font-size: 1.1rem;">${story.categoria || ''}</div>
            </div>

            <!-- Botones inferiores -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
              <a href="index.html" class="btn" style="background: #F4A261; padding: 1rem 3rem; border-radius: 0; color: #000; font-weight: 800; font-size: 1.1rem; border: none; text-decoration: none;">Ir al inicio</a>
              <a href="historias.html" class="btn" style="background: #F4A261; padding: 1rem 3rem; border-radius: 0; color: #000; font-weight: 800; font-size: 1.1rem; border: none; text-decoration: none;">Ver otras historias</a>
            </div>
            
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
