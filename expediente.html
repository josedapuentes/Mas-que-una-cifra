<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expediente de Memoria | Más que una cifra</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <style>
    .expediente-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 3rem;
      max-width: 900px;
      margin: 2rem auto;
      box-shadow: var(--shadow-card);
    }
    .badge-seal {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .timeline-box {
      border-left: 2px solid var(--accent-gold);
      padding-left: 1.5rem;
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <header class="navbar">
    <a href="index.html" class="logo-container">
      <img src="img/hero-ubpd.jpg" alt="Logo UBPD" style="height: 60px; border-radius: 4px; object-fit: cover; width: 100px;">
    </a>

    <nav>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Más que una cifra</a></li>
        <li class="nav-separator">|</li>
        <li><a href="historias.html" class="nav-link">Las historias</a></li>
        <li class="nav-separator">|</li>
        <li><a href="#" class="nav-link">Sobre la UBPD</a></li>
      </ul>
    </nav>
    <div id="authContainer">
      <a href="login.html" class="btn-nav-upload">Carga historias</a>
    </div>
  </header>

  <main class="container" id="mainContainer">
    <!-- Contenido cargado dinámicamente vía Javascript -->
  </main>

  <footer>
    <p><strong>Más que una cifra</strong> &copy; 2026 — Unidad de Búsqueda de Personas dadas por Desaparecidas (UBPD)</p>
  </footer>

  <script src="js/db.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code') || "MQUC-2026-001";
      const story = DB.getStoryByCode(code);
      const container = document.getElementById("mainContainer");

      if (!story) {
        container.innerHTML = `
          <div style="text-align: center; padding: 5rem 1rem;">
            <h2>Expediente no encontrado</h2>
            <p style="color: var(--text-secondary); margin: 1rem 0;">El código ${code} no corresponde a un registro activo.</p>
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
          <div style="background: #D1D1D1; width: 250px; height: 300px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #333;">
            Fotografía
          </div>
          <div style="display: flex; align-items: center;">
            <h1 style="font-family: var(--font-sans); font-size: 3rem; color: #fff; max-width: 500px; line-height: 1.1;">${story.nombre}</h1>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 200px 1fr 200px 1fr; gap: 1rem; align-items: center; margin-bottom: 1rem;">
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center;">Región</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 50px;">${story.region}</div>
          
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center;">Municipio</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 50px;">${story.municipio}</div>
        </div>

        <div style="display: grid; grid-template-columns: 200px 1fr 200px 1fr; gap: 1rem; align-items: center; margin-bottom: 1rem;">
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center;">Edad</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 50px;">-</div>
          
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center; line-height: 1.2;">Fecha de<br>los hechos</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 50px;">${story.fecha}</div>
        </div>

        <div style="display: grid; grid-template-columns: 200px 1fr; gap: 1rem; align-items: center; margin-bottom: 1rem;">
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center; line-height: 1.2;">Categoría de<br>Vida / Rol</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 50px;">${story.categoria}</div>
        </div>

        <div style="display: grid; grid-template-columns: 200px 1fr; gap: 1rem; align-items: stretch; margin-bottom: 3rem;">
          <div style="background: var(--accent-emerald); padding: 1rem; color: white; font-weight: bold; text-align: center;">Testimonio</div>
          <div style="background: #D1D1D1; padding: 1rem; color: #333; min-height: 200px; white-space: pre-wrap;">${story.relato}</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
          <a href="index.html" class="btn btn-primary" style="padding: 1rem 3rem; border-radius: 0;">Ir al inicio</a>
          <a href="historias.html" class="btn btn-primary" style="padding: 1rem 3rem; border-radius: 0;">Ver otras historias</a>
        </div>
      `;
    });
  </script>
</body>
</html>
