<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Más que una cifra</title>
  <meta name="description" content="Acceso administrativo a la plataforma Más que una cifra.">
  <link rel="stylesheet" href="styles.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);">

  <div class="modal-card" style="position: relative; max-width: 420px; text-align: center; padding: 3rem 2.5rem;">
    <a href="index.html" class="logo-container" style="justify-content: center; margin-bottom: 2rem; width: 100%;">
      <img src="img/logo-mquc.png" alt="Logo Más que una cifra" style="width: 150px; height: 150px; object-fit: contain;">
    </a>
    
    <h1 style="font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 0.5rem;">Bienvenido de vuelta</h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem;">Ingresa tus credenciales para acceder al sistema institucional.</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)" style="text-align: left;">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico o Nombre de usuario</label>
        <input type="text" id="email" class="form-control" placeholder="usuario@correo.com o mi_usuario" required autofocus>
      </div>
      
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 3rem;">
          <button type="button" onclick="togglePwd()" id="togglePwdBtn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-muted);" title="Ver contraseña">👁️</button>
        </div>
      </div>
      
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">
        <span>Iniciar Sesión</span>
      </button>
      
      <div id="loginError" style="color: var(--accent-rose); font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 1rem; display: none;"></div>
      
      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="#" onclick="handleResetPassword(event)" style="color: var(--text-primary); font-size: 0.85rem; text-decoration: underline;">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
    
    <div style="margin-top: 2rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
      <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none; font-weight: 600;">← Volver al inicio</a>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Si ya está logueado, redirigir al dashboard
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AUTH.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    });

    function togglePwd() {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePwdBtn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
        btn.title = 'Ocultar contraseña';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
        btn.title = 'Ver contraseña';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('loginError');
      
      btn.disabled = true;
      btn.innerHTML = '<span style="opacity: 0.7;">Iniciando sesión...</span>';
      errorDiv.style.display = 'none';
      
      try {
        const { data, error } = await AUTH.login(email, password);
        
        if (error) {
          btn.disabled = false;
          btn.innerHTML = '<span>Iniciar Sesión</span>';
          errorDiv.style.display = 'block';
          if (error.message.includes('Invalid login credentials')) {
            errorDiv.innerText = 'Credenciales incorrectas. Verifica tu usuario/correo y contraseña.';
          } else {
            errorDiv.innerText = 'Error: ' + error.message;
          }
        } else {
          btn.innerHTML = '<span>¡Autenticado! Redirigiendo...</span>';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<span>Iniciar Sesión</span>';
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Error crítico: ' + err.message + '. (¿Estás usando file://?)';
        console.error(err);
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errorDiv = document.getElementById('loginError');
      
      if (!email) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Por favor, ingresa tu correo institucional arriba para recuperar la contraseña.';
        return;
      }
      
      errorDiv.style.display = 'block';
      errorDiv.style.color = 'var(--text-secondary)';
      errorDiv.innerText = 'Enviando correo de recuperación...';
      
      const sb = getSupabaseClient();
      const { data, error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html',
      });
      
      if (error) {
        errorDiv.style.color = 'var(--accent-rose)';
        errorDiv.innerText = 'Error al enviar recuperación: ' + error.message;
      } else {
        errorDiv.style.color = '#39B7B3';
        errorDiv.innerText = '¡Correo enviado! Revisa la bandeja de entrada de ' + email + ' para reestablecer tu contraseña.';
      }
    }
  </script>
</body>
</html>
